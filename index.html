// ── CYCLE MATH ──────────────────────────────────────────────────
const ANCHOR = new Date("2026-04-20T00:00:00");
const CYCLE_LEN = 26;

function getCycleDay(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const a=new Date(ANCHOR);a.setHours(0,0,0,0);
  const diff=Math.floor((d-a)/86400000);
  return((diff%CYCLE_LEN)+CYCLE_LEN)%CYCLE_LEN+1;
}
function getPhaseId(day){
  if(day<=5) return"menstruation";
  if(day<=13)return"follicular";
  if(day<=15)return"ovulation";
  return"luteal";
}
function getNextPeriod(today,cd){
  const days=cd===1?0:CYCLE_LEN-cd+1;
  const n=new Date(today);n.setHours(0,0,0,0);
  n.setDate(n.getDate()+days);return n;
}
function fmtDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}

function getMacroStyle(m){
  const ml=m.toLowerCase();
  if(ml.startsWith("high carb"))  return{color:"#993C1D",bg:"#FAECE7"};
  if(ml.includes("moderate-high"))return{color:"#854F0B",bg:"#FAEEDA"};
  if(ml.includes("moderate"))     return{color:"#0F6E56",bg:"#E1F5EE"};
  return{color:"#534AB7",bg:"#EEEDFE"};
}

    ),
    e("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}},
      BLUEPRINT.map((block,i)=>{

          key:i,
          style:{
            background:"#fff",borderRadius:"12px",
            border:"0.5px solid #e0e0e0",overflow:"hidden"
          }
        },
          // Header
          e("div",{style:{background:block.bg,padding:"12px 16px",borderBottom:"0.5px solid "+block.accent+"30"}},

            e("p",{style:{fontSize:"12px",color:block.accent,fontStyle:"italic",opacity:0.8,paddingLeft:"28px"}},"\u201C"+block.quote+"\u201D")
          ),

          e("div",{style:{padding:"12px 16px"}},

              e("p",{style:{fontSize:"11px",fontWeight:500,color:currentPhase.text,margin:"0 0 3px",letterSpacing:"0.04em"}},"\u2B50 NOW ("+currentPhase.name+")"),

              block.items.map((item,j)=>e("div",{key:j,style:{display:"flex",gap:"10px",alignItems:"flex-start"}},

      e("span",{style:{position:"absolute",top:"-10px",left:"10px",fontSize:"72px",color:"#38BDF8",opacity:0.18,fontFamily:"Georgia,serif",lineHeight:1,userSelect:"none"}},"\u201C"),

    )

// ── PILLARS VIEW ─────────────────────────────────────────────────
function PillarsView({currentPhaseId}){
  const [open,setOpen]=useState(null);
  return e("div",null,
    e("p",{style:{fontSize:"13px",color:"#666",marginBottom:"14px",lineHeight:1.6}},"Every week — across all four cycle phases — your training should touch all five of these pillars. Mobility and balance are daily non-negotiables. Use this tab to understand why each one exists."),
    e("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}},
      PILLARS_DATA.map(p=>{
        const isOpen=open===p.num;
        const cycleTip=p.cycle[currentPhaseId];
        return e("div",{
          key:p.num,
          style:{background:"#fff",borderRadius:"12px",border:"0.5px solid #e0e0e0",overflow:"hidden"}
        },
          // Header row (always visible)
          e("div",{
            onClick:()=>setOpen(isOpen?null:p.num),
            style:{
              display:"flex",alignItems:"center",gap:"12px",
              padding:"13px 16px",cursor:"pointer",
              background:isOpen?p.bg:"#fff",
              transition:"background 0.15s"
            }
          },
            e("div",{style:{width:"34px",height:"34px",borderRadius:"8px",background:p.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",flexShrink:0}},p.icon),
            e("div",{style:{flex:1}},
              e("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
                e("p",{style:{fontSize:"14px",fontWeight:500,color:isOpen?p.accent:"#1a1a1a",margin:0}},"Pillar "+p.num+": "+p.name),
                e("span",{style:{fontSize:"11px",padding:"2px 8px",borderRadius:"20px",background:p.bg,color:p.accent,fontWeight:500}},p.target)
              ),
              e("p",{style:{fontSize:"12px",color:p.accent,fontStyle:"italic",margin:"2px 0 0",opacity:0.8}},"\u201C"+p.quote+"\u201D")
            ),
            e("span",{style:{fontSize:"18px",color:p.accent,transition:"transform 0.15s",display:"inline-block",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}},"\u203A")
          ),
          // Expanded content
          isOpen&&e("div",{style:{padding:"0 16px 16px",borderTop:"0.5px solid "+p.accent+"22"}},
            e("p",{style:{fontSize:"12px",color:"#444",lineHeight:1.65,margin:"12px 0 12px"}},p.desc),
            p.num===3&&e("div",{style:{background:"#F0F9FF",borderRadius:"8px",padding:"12px 14px",marginBottom:"12px",border:"1px solid #7DD3FC"}},
              e("p",{style:{fontSize:"11px",fontWeight:600,color:"#0284C7",letterSpacing:"0.06em",margin:"0 0 8px"}},"⚡ PROTOCOL: NORWEGIAN 4×4"),
              e("p",{style:{fontSize:"12px",color:"#0C4A6E",margin:"0 0 10px",lineHeight:1.5}},"The gold-standard interval method for improving VO2 max. ~35 minutes total. Best used 1–2x/week in follicular and ovulation phases."),
              e("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}},
                [
                  {n:"1",label:"Warm up","desc":"10 minutes at easy, conversational pace"},
                  {n:"2",label:"Interval × 4","desc":"4 minutes at 85–95% max heart rate — you cannot hold a conversation"},
                  {n:"3",label:"Recovery × 4","desc":"3 minutes at easy Zone 2 pace between each interval"},
                  {n:"4",label:"Cool down","desc":"5 minutes easy walking or light movement"},
                ].map(step=>e("div",{key:step.n,style:{display:"flex",gap:"10px",alignItems:"flex-start"}},
                  e("span",{style:{width:"20px",height:"20px",borderRadius:"50%",background:"#0284C7",color:"#fff",fontSize:"10px",fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},step.n),
                  e("div",null,
                    e("p",{style:{fontSize:"12px",fontWeight:500,color:"#0C4A6E",margin:"0 0 1px"}},step.label),
                    e("p",{style:{fontSize:"11px",color:"#0284C7",margin:0,opacity:0.85}},step.desc)
                  )
                ))
              )
            ),
            e("div",{style:{background:p.bg,borderRadius:"8px",padding:"12px 14px",border:"0.5px solid "+p.accent+"44"}},
              e("p",{style:{fontSize:"11px",fontWeight:500,color:p.accent,letterSpacing:"0.04em",margin:"0 0 8px"}},"PHASE NOTES"),
              e("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}},
                Object.entries(p.cycle).map(([phId,note])=>{
                  const ph=PHASES.find(x=>x.id===phId);
                  const isNow=phId===currentPhaseId;
                  return e("div",{key:phId,style:{display:"flex",gap:"8px",alignItems:"flex-start"}},
                    e("span",{style:{
                      fontSize:"10px",padding:"2px 6px",borderRadius:"4px",flexShrink:0,
                      background:isNow?ph.accent:"transparent",

                })
              )
            )
          )
        );
      })
    ),
    // Weekly coverage check
    e("div",{style:{marginTop:"14px",padding:"14px 16px",background:"#E1F5EE",borderRadius:"10px",border:"0.5px solid #1D9E7555"}},
      e("p",{style:{fontSize:"12px",fontWeight:500,color:"#0F6E56",margin:"0 0 6px"}},"✓ Weekly coverage check"),
      e("p",{style:{fontSize:"12px",color:"#0F6E56",lineHeight:1.6,margin:0}},"Every week in this guide is designed to cover all 5 pillars. Strength appears 2–3x. Zone 2 appears daily (walking, swimming, easy runs). High intensity appears 1–2x via soccer, runs, or Norwegian 4x4. Mobility and balance are layered in every single day.")
    )
  );
}

// ── APP ──────────────────────────────────────────────────────────
function App(){
  const today=new Date();today.setHours(0,0,0,0);
  const cycleDay=getCycleDay(today);
  const currentId=getPhaseId(cycleDay);
  const currentPhase=PHASES.find(p=>p.id===currentId);
  const nextPeriod=getNextPeriod(today,cycleDay);
  const daysUntil=Math.round((nextPeriod-today)/86400000);
  const todayLabel=today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const DOW_MAP=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const todayDow=DOW_MAP[today.getDay()];

  const [tab,setTab]=useState("weekly");
  const [qIdx,setQIdx]=useState(0);

  useEffect(()=>{
    const t=setInterval(()=>setQIdx(i=>(i+1)%QUOTES.length),8000);
    return()=>clearInterval(t);
  },[]);

  return e("div",null,
    // Header
    e("div",{style:{marginBottom:"12px"}},
      e("h1",{style:{fontSize:"21px",fontWeight:500,color:"#1a1a1a",margin:"0 0 4px"}},"Training Regimen"),
      e("p",{style:{fontSize:"13px",color:"#888",margin:"0 0 8px",fontStyle:"italic"}},"Synced to hormonal cycle, tailored to Bonnie."),
      e("div",{style:{display:"inline-flex",gap:"14px",flexWrap:"wrap",background:"#EDECE8",borderRadius:"8px",padding:"8px 14px",fontSize:"13px",color:"#666"}},
        e("span",null,todayLabel),
        e("span",{style:{color:"#ccc"}},"|"),
        e("span",null,"Cycle day ",e("strong",{style:{color:"#1a1a1a",fontWeight:500}},cycleDay)," of ",CYCLE_LEN),
        e("span",{style:{color:"#ccc"}},"|"),
        e("span",null,
          "Next period ",
          e("strong",{style:{color:"#1a1a1a",fontWeight:500}},daysUntil===0?"today":"in "+daysUntil+" days"),
          daysUntil>0?" ("+fmtDate(nextPeriod)+")":""
        )
      )
    ),

    // Quote bar
    e(QuoteBar,{quotes:QUOTES,idx:qIdx}),

    // Tab nav
    e(TabNav,{tab,setTab}),

    // Views
    tab==="weekly"&&e(WeeklyView,{currentId,cycleDay,todayDow,currentPhase}),
    tab==="blueprint"&&e(BlueprintView,{currentPhase}),
    tab==="pillars"&&e(PillarsView,{currentPhaseId:currentId})
  );
}

ReactDOM.render(e(App),document.getElementById("root"));
}; // end window.onload
</script>
</body>
